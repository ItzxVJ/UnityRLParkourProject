behaviors:
  ParkourCube:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 8192
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 6
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 50000
    threaded: false

environment_parameters:
  level_index:
    curriculum:
      - name: BasicNavigationLesson
        completion_criteria:
          measure: reward
          behavior: ParkourCube
          signal_type: extrinsic
          threshold: 1.6
          min_lesson_length: 100
        value: 1.0

      - name: SmallGapsLesson
        completion_criteria:
          measure: reward
          behavior: ParkourCube
          signal_type: extrinsic
          threshold: 1.5
          min_lesson_length: 100
        value: 2.0

      - name: PrecisionPlatformingLesson
        completion_criteria:
          measure: reward
          behavior: ParkourCube
          signal_type: extrinsic
          threshold: 1.3
          min_lesson_length: 100
        value: 3.0

      - name: AdvancedParkourLesson
        completion_criteria:
          measure: reward
          behavior: ParkourCube
          signal_type: extrinsic
          threshold: 1.1
          min_lesson_length: 100
        value: 4.0

      - name: ExpertCourseLesson
        value: 5.0
